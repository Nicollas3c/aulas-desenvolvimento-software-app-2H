<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="folha1.css">
    <script type="text/javascript" src="codigo.js">
    </script>
</head>
<body>
    <header>
        <h1 id="titulo">Cadastro</h1>
    </header> <br> <br> <br> <br> <br> <br> <br>
    <section>
        <form action="PAINEL.html" autocomplete="off" onsubmit="return confirmar()">   

            <fieldset>   
                <legend>Cadastre-se</legend>

                    Nome Completo: <br>
                    <input type="text" id="txtnom" size="20" maxlength="100" required="required" pattern="[a-zA-Z\s]+$"  /> 
                     <br>
                    Gênero: <br>
                     <input type="radio" name="genero" id="m" required class="genero">Masculino <br>
                     <input type="radio" name="genero" id="f" class="genero">Feminino <br>
                     <input type="radio" name="genero" id="o" class="genero">Outro <br>

                     Email: <br>
                     <input type="email" id="txtema" required="required"/> 
                      <br> 

                      Telefone: <br>
                      <input type="tel" id="txttel" placeholder="(00) 00000-0000" required="required" pattern="(\([0-9]{2}\))\s([9]{1})?([0-9]{4})-([0-9]{4})"/> 
                       <br> 

                    Senha: <br>
                    <input type="password" id="txtsen" required="required"/> 
                     <br>

                    Confirmar Senha: <br>
                    <input type="password" id="txtsco" required="required"/> 
                    <br>

                <div id="botao">
                    <input type="submit" value="Confirmar"> 
                    <input type="reset" value="Resetar"> <br>
                    <a href="LOGON.html">Voltar</a> <br>
                </div>
            </fieldset>
        </form>
    </section> <br> <br> <br> <br>
    <footer>
        tel: (11) 96534-8532 <br>
        email de contato: curso_inf@gmail.com <br>
        instagram: CursoInf_oficial <br>
        <a href="FaleConosco.html" class="faleConosco">Fale Conosco</a>
    </footer>
</body>

</html>
